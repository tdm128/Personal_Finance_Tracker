{% extends 'tracker/base.html' %}
{% block title %}{{ action }} Budget — IDKH$S{% endblock %}
{% block content %}
<div style="max-width:500px;">
    <div class="page-header">
        <div>
            <h1 class="page-title">{{ action }} Budget</h1>
            <p class="page-subtitle">Control your monthly spending limits</p>
        </div>
        <a href="{% url 'budget_list' %}" class="btn btn-secondary">← Back</a>
    </div>
    <div class="card">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Category</label>
                {{ form.category }}
            </div>
            <div class="form-group">
                <label class="form-label">Monthly Limit ($)</label>
                {{ form.monthly_limit }}
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div class="form-group">
                    <label class="form-label">Month (1–12)</label>
                    {{ form.month }}
                </div>
                <div class="form-group">
                    <label class="form-label">Year</label>
                    {{ form.year }}
                </div>
            </div>
            <button type="submit" class="btn btn-primary">💾 Save Budget</button>
        </form>
    </div>
</div>
{% endblock %}
