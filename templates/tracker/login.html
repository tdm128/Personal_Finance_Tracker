{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — IDKH$S</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-400: #4ade80; --green-500: #22c55e; --green-600: #16a34a;
            --green-700: #15803d; --green-800: #14532d; --dark: #0a0f0a;
            --dark-2: #111811; --dark-3: #1a2a1a; --gold: #d4a017; --gold-light: #f5c842;
            --text: #e8f5e9; --text-muted: #86efac; --red-light: #fca5a5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Syne', sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(ellipse at 20% 20%, rgba(21,128,61,0.2) 0%, transparent 50%),
                              radial-gradient(ellipse at 80% 80%, rgba(5,46,22,0.3) 0%, transparent 50%);
        }
        .auth-wrap { width: 100%; max-width: 420px; padding: 24px; }
        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-dollar {
            font-family: 'Space Mono', monospace;
            font-size: 56px;
            color: var(--green-500);
            line-height: 1;
            margin-bottom: 8px;
        }
        .logo-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--text);
            line-height: 1.3;
        }
        .logo-sub { font-size: 12px; color: var(--text-muted); opacity: .6; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
        .auth-card {
            background: #111811;
            border: 1px solid rgba(34,197,94,0.15);
            border-radius: 16px;
            padding: 32px;
        }
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--green-600); margin-bottom: 6px; }
        .form-input {
            width: 100%; background: #1a2a1a; border: 1px solid rgba(34,197,94,0.2);
            border-radius: 8px; color: var(--text); padding: 12px 14px;
            font-size: 14px; font-family: 'Syne', sans-serif; transition: border-color .2s; outline: none;
        }
        .form-input:focus { border-color: var(--green-500); box-shadow: 0 0 0 3px rgba(34,197,94,0.1); }
        .btn-full {
            width: 100%; padding: 14px; background: var(--green-600);
            color: #fff; border: none; border-radius: 8px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            font-family: 'Syne', sans-serif; transition: all .2s;
            margin-top: 8px;
        }
        .btn-full:hover { background: var(--green-500); transform: translateY(-1px); }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted); }
        .auth-footer a { color: var(--green-400); text-decoration: none; font-weight: 700; }
        .error-msg { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.2); border-radius: 8px; padding: 12px; font-size: 13px; color: var(--red-light); margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-logo">
            <div class="logo-dollar">$</div>
            <div class="logo-title">I Don't Know<br>How To Spend</div>
            <div class="logo-sub">Personal Finance Tracker</div>
        </div>
        <div class="auth-card">
            <h2 style="font-size:18px;font-weight:800;margin-bottom:24px;">Sign In</h2>
            {% if form.errors %}
            <div class="error-msg">Invalid username or password. Try again.</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-input" placeholder="your_username" autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-full">Sign In →</button>
            </form>
            <div class="auth-footer">
                Don't have an account? <a href="{% url 'register' %}">Sign up free</a>
            </div>
        </div>
    </div>
</body>
</html>
