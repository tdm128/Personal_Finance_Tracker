{% extends 'tracker/base.html' %}

{% block title %}Delete Transaction — IDKH$S{% endblock %}

{% block content %}
<div style="max-width:480px;margin:60px auto;">
    <div class="card" style="text-align:center;border-color:rgba(239,68,68,0.3);">
        <div style="font-size:48px;margin-bottom:16px;">🗑️</div>
        <h2 style="font-size:20px;font-weight:800;margin-bottom:8px;">Delete Transaction?</h2>
        <p style="color:var(--text-muted);font-size:14px;margin-bottom:24px;">
            You're about to delete <strong>"{{ transaction.title }}"</strong> — ${{ transaction.amount }}.<br>This cannot be undone.
        </p>
        <form method="post" style="display:flex;gap:12px;justify-content:center;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete It</button>
            <a href="{% url 'transaction_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
